# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3

# Mod Properties
mod_version=1.0.0
maven_group=com.metallum.shaders
archives_base_name=metallum-shaders

# Dependencies
fabric_version=0.155.2+26.2
java_version=25


# Loom
# Fabric Loom 1.17.13
loom_version=1.17-SNAPSHOT

# Java 25 for MC 26.2
# 让 Gradle 自动下载所需的 JDK
org.gradle.java.installations.auto-download=true

# 允许 Gradle 运行的 JVM 版本与插件要求的版本不同（避免严格校验）
org.gradle.jvm.version=25

# Metallum dependency (Metal API bridge for Minecraft)
metallum_version=1.0.1

# Sodium compatibility target
sodium_version=0.9.1+mc26.2
